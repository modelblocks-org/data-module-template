name: Template pre-commit autoupdate

on:
  workflow_dispatch:
  schedule:  # quarterly
    - cron: "0 9 1 1,4,7,10 *"

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    name: Autoupdate template pre-commit pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: setup-pixi
        uses: prefix-dev/setup-pixi@v0.9.6

      - name: Run pre-commit autoupdate on template file
        run: pixi run pre-commit autoupdate --config template/.pre-commit-config.yaml --jobs 1

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/template-pre-commit-autoupdate
          delete-branch: true
          commit-message: "[pre-commit.ci] template pre-commit autoupdate"
          title: "Update template pre-commit hook revisions"
          body: |
            Automated update for `template/.pre-commit-config.yaml`.
          add-paths: |
            template/.pre-commit-config.yaml
