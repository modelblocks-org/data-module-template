# !!!!! DO NOT MODIFY UNLESS ABSOLUTELY NECESSARY !!!!!
# This workflow helps standardise integration tests across data modules
name: Pull Request CI tests for Modelblocks data modules
on:
  pull_request:
    branches:
      - "main"
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
      - name: Run standard Modelblocks tests
        id: test_modelblocks
        run: pixi run test-modelblocks
        continue-on-error: true
      - name: Run unit tests
        id: test_unit
        run: pixi run test-unit
        continue-on-error: true
      - name: Run snakemake linting
        id: linting
        run: |
          pixi run snakemake --lint --snakefile workflow/Snakefile
          pixi run snakemake --lint --snakefile tests/modelblocks/integration/Snakefile
        continue-on-error: true
      - name: Save integration logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs-${{ matrix.os }}
          path: tests/modelblocks/integration/resources/module/logs
          if-no-files-found: ignore
          retention-days: 30
      - name: Fail if integration or linting failed
        if: ${{ steps.test_modelblocks.outcome == 'failure' || steps.test_unit.outcome == 'failure' || steps.linting.outcome == 'failure' }}
        run: exit 1
